<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Link大村市消防団 - 多言語指差し防災アプリ</title>
  
  <!-- 標準PWAマニフェストファイルの読み込み -->
  <link rel="manifest" href="./manifest.json">
  
  <meta name="theme-color" content="#E53935">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Link大村市消防団">
  
  <!-- アプリのファビコン/アップルタッチアイコン -->
  <link rel="apple-touch-icon" href="./icon.jpg">
  <link rel="icon" type="image/jpeg" href="./icon.jpg">

  <style>
    /* デザインシステム & カラーパレット */
    :root {
      --color-bg-団員: #222222;
      --color-bg-外国人: #111111;
      --color-card-団員: #333333;
      --color-card-外国人: #1e1e1e;
      --color-primary: #E53935; /* 防災レッド */
      --color-warning: #FDD835; /* 警戒イエロー */
      --color-safe: #43A047;    /* 安全グリーン */
      --color-text-light: #FFFFFF;
      --color-text-dark: #111111;
      --color-text-muted: #B0BEC5;
      --font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--font-family);
      background-color: #000;
      color: var(--color-text-light);
    }

    /* ----------------------------------------------------
       1. 起動画面（言語選択画面）のスタイル
       ---------------------------------------------------- */
    .welcome-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #111111;
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
      transition: opacity 0.3s ease, visibility 0.3s, transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .welcome-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* 180度回転状態（起動画面） */
    .welcome-screen.rotated {
      transform: rotate(180deg);
    }

    .welcome-header {
      text-align: center;
      margin-top: 24px;
      margin-bottom: 24px;
    }

    .welcome-header h1 {
      font-size: 1.6rem;
      font-weight: 900;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      line-height: 1.4;
      padding: 0 40px; /* 回転ボタンと被らないように左右に余白 */
    }

    .welcome-subtitle {
      font-size: 0.9rem;
      color: var(--color-text-muted);
      margin-top: 4px;
    }

    /* 国旗選択グリッド */
    .flag-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      padding-bottom: 24px;
    }

    /* 国旗選択ボタン（全体が大きく押しやすいカード） */
    .flag-card {
      background-color: var(--color-card-外国人);
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s, background-color 0.2s;
    }

    .flag-card:active {
      transform: scale(0.96);
      background-color: rgba(255, 255, 255, 0.05);
    }

    /* 国旗のグラフィック（SVG）サイズ調整 */
    .flag-svg-container {
      width: 100%;
      max-width: 120px;
      aspect-ratio: 3 / 2;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      margin-bottom: 8px;
    }

    .flag-svg-container svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .flag-card span {
      font-size: 1.1rem;
      font-weight: bold;
      color: #FFFFFF;
      margin-top: 4px;
    }

    .flag-card .native-lang {
      font-size: 0.8rem;
      color: var(--color-text-muted);
      margin-top: 2px;
    }

    /* ----------------------------------------------------
       2. メインの対面コミュニケーション画面のスタイル
       ---------------------------------------------------- */
    .app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: -webkit-fill-available;
      transition: filter 0.3s;
    }

    /* 上半分：外国人エリア */
    .section-foreigner {
      flex: 1;
      background-color: var(--color-bg-外国人);
      display: flex;
      flex-direction: column;
      padding: 12px;
      position: relative;
      overflow: hidden;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 下半分：団員エリア */
    .section-member {
      flex: 1;
      background-color: var(--color-bg-団員);
      border-top: 4px solid var(--color-primary);
      display: flex;
      flex-direction: column;
      padding: 12px;
      position: relative;
      overflow: hidden;
    }

    /* 180度回転状態（外国人エリア） */
    .section-foreigner.rotated {
      transform: rotate(180deg);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .app-title {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--color-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .app-badge {
      background-color: var(--color-primary);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    /* 言語変更（起動画面に戻る）ボタン */
    .back-to-lang-btn {
      background-color: var(--color-card-団員);
      border: 2px solid var(--color-primary);
      color: #FFFFFF;
      padding: 6px 12px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .back-to-lang-btn:active {
      background-color: var(--color-primary);
    }

    /* 質問選択エリア（団員側） */
    .question-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      flex: 1;
      margin-bottom: 8px;
    }

    .question-card {
      background-color: var(--color-card-団員);
      border: 3px solid transparent;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .question-card.active {
      border-color: var(--color-warning);
      background-color: rgba(253, 216, 53, 0.15);
    }

    .question-card svg {
      width: 48px;
      height: 48px;
      margin-bottom: 6px;
    }

    .question-card span {
      font-size: 0.85rem;
      font-weight: bold;
      line-height: 1.2;
    }

    /* 応答ログ表示エリア（団員側） */
    .response-log-box {
      background-color: #000000;
      border-radius: 8px;
      padding: 10px;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-left: 5px solid var(--color-warning);
    }

    .response-log-label {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      margin-right: 8px;
      white-space: nowrap;
    }

    .response-log-content {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--color-warning);
      flex: 1;
      text-align: center;
    }

    .reset-btn {
      background-color: #444;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* 外国人表示エリア */
    .foreigner-display {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: 8px;
    }

    /* 180度回転コントロールボタン */
    .rotate-control {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
    }

    .rotate-btn {
      background-color: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    .rotate-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .foreigner-question-bubble {
      background-color: var(--color-card-外国人);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 12px;
    }

    .foreigner-question-text {
      font-size: 1.4rem;
      font-weight: 900;
      line-height: 1.3;
      color: #FFF;
      word-break: keep-all;
    }

    /* 回答ボタンエリア */
    .answer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 8px;
    }

    .answer-btn {
      height: 95px;
      border: none;
      border-radius: 16px;
      color: #fff;
      font-size: 1.6rem;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.1s, opacity 0.2s;
    }

    .answer-btn:active {
      transform: scale(0.96);
    }

    .answer-btn.btn-yes {
      background: linear-gradient(135deg, var(--color-primary), #B71C1C);
    }

    .answer-btn.btn-no {
      background: linear-gradient(135deg, #37474F, #21272A);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .answer-btn.btn-safe {
      background: linear-gradient(135deg, var(--color-safe), #1B5E20);
    }

    .answer-btn-sub {
      font-size: 0.95rem;
      font-weight: bold;
      opacity: 0.9;
    }

    /* オフライン状態のバナー表示用 */
    .offline-banner {
      display: none;
      background-color: var(--color-warning);
      color: var(--color-text-dark);
      text-align: center;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 0;
    }

    /* 振動・アニメーション等の視覚フィードバック */
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    .pulse {
      animation: pulse 0.5s ease-in-out;
    }
  </style>
</head>
<body>

  <!-- 1. 起動画面（言語選択） -->
  <div id="welcome-screen" class="welcome-screen">
    <!-- 180度反転ボタン -->
    <div class="rotate-control">
      <button class="rotate-btn" onclick="toggleWelcomeRotation()" title="外国人側に画面を向けた際に文字を180度反転させます">
        <svg viewBox="0 0 24 24">
          <path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/>
        </svg>
      </button>
    </div>

    <div class="welcome-header">
      <h1>
        <span>🌐</span>
        Select your country / language
      </h1>
      <div class="welcome-subtitle">国籍・言語を選択してください</div>
    </div>

    <div class="flag-grid">
      <!-- ベトナム -->
      <div class="flag-card" onclick="selectLanguage('vi')">
        <div class="flag-svg-container">
          <svg viewBox="0 0 30 20">
            <rect width="30" height="20" fill="#DA251D"/>
            <polygon points="15,4.5 16.2,8.2 20,8.2 16.9,10.5 18.1,14.2 15,11.9 11.9,14.2 13.1,10.5 10,8.2 13.8,8.2" fill="#FFFF00"/>
          </svg>
        </div>
        <span>ベトナム</span>
        <div class="native-lang">Việt Nam</div>
      </div>

      <!-- インドネシア -->
      <div class="flag-card" onclick="selectLanguage('id')">
        <div class="flag-svg-container">
          <svg viewBox="0 0 30 20">
            <rect width="30" height="10" fill="#FF0000"/>
            <rect y="10" width="30" height="10" fill="#FFFFFF"/>
          </svg>
        </div>
        <span>インドネシア</span>
        <div class="native-lang">Indonesia</div>
      </div>

      <!-- 中国 -->
      <div class="flag-card" onclick="selectLanguage('zh')">
        <div class="flag-svg-container">
          <svg viewBox="0 0 30 20">
            <rect width="30" height="20" fill="#DE2910"/>
            <!-- 大星 -->
            <polygon points="5,5 5.5,6.5 7,6.5 5.8,7.4 6.2,8.9 5,8 3.8,8.9 4.2,7.4 3,6.5 4.5,6.5" fill="#FFDE00"/>
            <!-- 小星4つ（簡略化して配置） -->
            <polygon points="9,2.5 9.2,3.1 9.8,3.1 9.3,3.5 9.5,4.1 9,3.7 8.5,4.1 8.7,3.5 8.2,3.1 8.8,3.1" fill="#FFDE00"/>
            <polygon points="11,4.5 11.2,5.1 11.8,5.1 11.3,5.5 11.5,6.1 11,5.7 10.5,6.1 10.7,5.5 10.2,5.1 10.8,5.1" fill="#FFDE00"/>
            <polygon points="11,7.5 11.2,8.1 11.8,8.1 11.3,8.5 11.5,9.1 11,8.7 10.5,9.1 10.7,8.5 10.2,8.1 10.8,8.1" fill="#FFDE00"/>
            <polygon points="9,9.5 9.2,10.1 9.8,10.1 9.3,10.5 9.5,11.1 9,10.7 8.5,11.1 8.7,10.5 8.2,10.1 8.8,10.1" fill="#FFDE00"/>
          </svg>
        </div>
        <span>中 国</span>
        <div class="native-lang">简体中文</div>
      </div>

      <!-- ミャンマー -->
      <div class="flag-card" onclick="selectLanguage('my')">
        <div class="flag-svg-container">
          <svg viewBox="0 0 30 20">
            <rect width="30" height="6.6" fill="#FECB00"/>
            <rect y="6.6" width="30" height="6.8" fill="#109B30"/>
            <rect y="13.4" width="30" height="6.6" fill="#E81C23"/>
            <polygon points="15,5 16.5,9.5 21,9.5 17.5,12.2 19,16.7 15,14 11,16.7 12.5,12.2 9,9.5 13.5,9.5" fill="#FFFFFF"/>
          </svg>
        </div>
        <span>ミャンマー</span>
        <div class="native-lang">မြန်မာဘာသာ</div>
      </div>

      <!-- アメリカ -->
      <div class="flag-card" onclick="selectLanguage('en')">
        <div class="flag-svg-container">
          <svg viewBox="0 0 30 20">
            <!-- 背景のストライプ（赤白） -->
            <rect width="30" height="2.8" fill="#B22234"/><rect y="2.8" width="30" height="2.8" fill="#FFF"/>
            <rect y="5.6" width="30" height="2.8" fill="#B22234"/><rect y="8.4" width="30" height="2.8" fill="#FFF"/>
            <rect y="11.2" width="30" height="2.8" fill="#B22234"/><rect y="14" width="30" height="2.8" fill="#FFF"/>
            <rect y="16.8" width="30" height="3.2" fill="#B22234"/>
            <!-- 左上の青 -->
            <rect width="12" height="11.2" fill="#3C3B6E"/>
            <circle cx="3" cy="3" r="0.6" fill="#FFF"/><circle cx="6" cy="3" r="0.6" fill="#FFF"/><circle cx="9" cy="3" r="0.6" fill="#FFF"/>
            <circle cx="4.5" cy="5.6" r="0.6" fill="#FFF"/><circle cx="7.5" cy="5.6" r="0.6" fill="#FFF"/>
            <circle cx="3" cy="8.2" r="0.6" fill="#FFF"/><circle cx="6" cy="8.2" r="0.6" fill="#FFF"/><circle cx="9" cy="8.2" r="0.6" fill="#FFF"/>
          </svg>
        </div>
        <span>アメリカ (英語)</span>
        <div class="native-lang">English</div>
      </div>

      <!-- 韓国 -->
      <div class="flag-card" onclick="selectLanguage('ko')">
        <div class="flag-svg-container">
          <svg viewBox="0 0 30 20">
            <rect width="30" height="20" fill="#FFFFFF"/>
            <!-- 中央の太極マーク -->
            <circle cx="15" cy="10" r="4.5" fill="#CD2E3A"/>
            <path d="M15 14.5 A 2.25 2.25 0 0 1 15 10 A 2.25 2.25 0 0 0 15 5.5 A 4.5 4.5 0 0 1 15 14.5 Z" fill="#0047A0"/>
            <!-- 四隅の卦（簡易表現） -->
            <path d="M7.5 5.5 L9.5 3.5 M7 6 L9 4 M8 5 L10 3" stroke="#000" stroke-width="0.8"/>
            <path d="M20.5 5.5 L22.5 3.5 M21 5 L23 3" stroke="#000" stroke-width="0.8"/>
            <path d="M7.5 14.5 L9.5 16.5 M8 15 L10 17" stroke="#000" stroke-width="0.8"/>
            <path d="M20.5 14.5 L22.5 16.5 M20 14 L22 16 M21 15 L23 17" stroke="#000" stroke-width="0.8"/>
          </svg>
        </div>
        <span>韓 国</span>
        <div class="native-lang">한국어</div>
      </div>

      <!-- 日本 -->
      <div class="flag-card" onclick="selectLanguage('ja')">
        <div class="flag-svg-container">
          <svg viewBox="0 0 30 20">
            <rect width="30" height="20" fill="#FFFFFF"/>
            <circle cx="15" cy="10" r="6" fill="#BC002D"/>
          </svg>
        </div>
        <span>日 本</span>
        <div class="native-lang">日本語</div>
      </div>

    </div>
  </div>

  <!-- 2. メインの対面コミュニケーション画面 -->
  <div class="app-container">
    
    <!-- オフライン表示バナー -->
    <div id="offline-banner" class="offline-banner">オフラインモードで動作中（ホーム画面からいつでも起動できます）</div>

    <!-- 上半分：外国人住民エリア -->
    <section class="section-foreigner" id="foreigner-section">
      <!-- 180度反転ボタン -->
      <div class="rotate-control">
        <button class="rotate-btn" onclick="toggleRotation()" title="外国人側に画面を向けた際に文字を180度反転させます">
          <svg viewBox="0 0 24 24">
            <path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/>
          </svg>
        </button>
      </div>

      <div class="foreigner-display">
        <!-- 翻訳された質問表示 -->
        <div class="foreigner-question-bubble">
          <div class="foreigner-question-text" id="foreign-question-text">
            Are you injured?
          </div>
        </div>

        <!-- 回答指差しボタン -->
        <div class="answer-grid" id="answer-buttons-container">
          <!-- JSで動的に書き換えます -->
        </div>
      </div>
    </section>

    <!-- 下半分：団員エリア -->
    <section class="section-member">
      <div class="section-header">
        <div class="app-title">
          <span>Link大村市消防団</span>
          <span class="app-badge">団員用</span>
        </div>
        
        <!-- 言語変更（起動画面に戻る） -->
        <button class="back-to-lang-btn" onclick="showWelcomeScreen()">
          <span>🔙</span> 言語変更
        </button>
      </div>

      <!-- 質問選択カード -->
      <div class="question-grid">
        <div class="question-card active" id="q-card-0" onclick="selectQuestion(0)">
          <!-- ケガ（救急・十字） -->
          <svg viewBox="0 0 100 100">
            <rect x="10" y="10" width="80" height="80" rx="15" fill="#E53935"/>
            <path d="M50 25v50M25 50h50" stroke="#FFF" stroke-width="16" stroke-linecap="round"/>
            <circle cx="50" cy="50" r="12" fill="#E53935"/>
          </svg>
          <span>ケガ確認</span>
        </div>
        <div class="question-card" id="q-card-1" onclick="selectQuestion(1)">
          <!-- 歩行（歩く人） -->
          <svg viewBox="0 0 100 100">
            <rect x="10" y="10" width="80" height="80" rx="15" fill="#43A047"/>
            <!-- 人影シルエット -->
            <circle cx="55" cy="25" r="10" fill="#FFF"/>
            <path d="M50 38c-5 0-12 5-15 10l-5 8M50 38l5 15 10 18M42 53l-6 22M52 53l6 12 12 10" stroke="#FFF" stroke-width="8" stroke-linecap="round" fill="none"/>
          </svg>
          <span>歩行可否</span>
        </div>

    // アプリ状態管理
    let currentLanguage = 'en';
    let currentQuestionIndex = 0;

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
      setupSpeech();
      
      // オンライン・オフライン検知
      const updateOnlineStatus = () => {
        const offlineBanner = document.getElementById('offline-banner');
        if (navigator.onLine) {
          offlineBanner.style.display = 'none';
        } else {
          offlineBanner.style.display = 'block';
        }
      };
      
      window.addEventListener('online', updateOnlineStatus);
      window.addEventListener('offline', updateOnlineStatus);
      updateOnlineStatus(); // 初期チェック
    });

    // 画面レンダリング
    function renderApp() {
      const data = disasterData[currentQuestionIndex];
      const translation = data.translations[currentLanguage];
      
      // 質問文の更新
      const qTextElement = document.getElementById('foreign-question-text');
      qTextElement.textContent = translation.question;
      
      // アニメーション適用
      qTextElement.parentElement.classList.remove('pulse');
      void qTextElement.parentElement.offsetWidth; // リフロー発生させてアニメーションリセット
      qTextElement.parentElement.classList.add('pulse');

      // 回答ボタンの生成
      const container = document.getElementById('answer-buttons-container');
      container.innerHTML = '';
      
      translation.answers.forEach(ans => {
        const btn = document.createElement('button');
        btn.className = `answer-btn ${ans.class}`;
        btn.innerHTML = `
          <span>${ans.label}</span>
          <span class="answer-btn-sub">${ans.subText}</span>
        `;
        btn.onclick = () => selectAnswer(ans.value);
        container.appendChild(btn);
      });
    }

    // 言語の選択（起動画面から）
    function selectLanguage(lang) {
      triggerFeedback();
      currentLanguage = lang;
      
      // 起動画面を非表示にする
      document.getElementById('welcome-screen').classList.add('hidden');
      
      // アプリ画面の更新
      renderApp();
      speakQuestion();
    }

    // 言語選択画面（起動画面）を表示する
    function showWelcomeScreen() {
      triggerFeedback();
      document.getElementById('welcome-screen').classList.remove('hidden');
    }

    // 質問選択（団員側）
    function selectQuestion(index) {
      triggerFeedback();
      currentQuestionIndex = index;
      
      // アクティブカードの切り替え
      for (let i = 0; i < disasterData.length; i++) {
        document.getElementById(`q-card-${i}`).classList.toggle('active', i === index);
      }
      
      renderApp();
      speakQuestion();
    }

    // 回答選択（外国人側）
    function selectAnswer(value) {
      triggerFeedback();
      const display = document.getElementById('response-display');
      display.textContent = value;
      
      // 点滅アニメーション
      display.classList.remove('pulse');
      void display.offsetWidth;
      display.classList.add('pulse');
    }

    // 回答リセット
    function resetLog() {
      triggerFeedback();
      document.getElementById('response-display').textContent = "未回答";
    }

    // 180度回転トグル（外国人質問エリア）
    function toggleRotation() {
      triggerFeedback();
      const foreignerSection = document.getElementById('foreigner-section');
      foreignerSection.classList.toggle('rotated');
    }

    // 180度回転トグル（起動画面）
    function toggleWelcomeRotation() {
      triggerFeedback();
      const welcomeScreen = document.getElementById('welcome-screen');
      welcomeScreen.classList.toggle('rotated');
    }

    // タッチフィードバック（バイブレーション）
    function triggerFeedback() {
      if (navigator.vibrate) {
        navigator.vibrate(40);
      }
    }

    // 音声読み上げ
    let synth = window.speechSynthesis;
    let voices = [];

    function setupSpeech() {
      if (synth) {
        voices = synth.getVoices();
        if (synth.onvoiceschanged !== undefined) {
          synth.onvoiceschanged = () => { voices = synth.getVoices(); };
        }
      }
    }

    function speakQuestion() {
      if (!synth) return;
      
      // 再生中の音声を停止
      synth.cancel();

      const data = disasterData[currentQuestionIndex];
      const translation = data.translations[currentLanguage];
      const utterance = new SpeechSynthesisUtterance(translation.audioText);
      
      // 言語コードのマッピング
      let langCode = 'en-US';
      if (currentLanguage === 'vi') langCode = 'vi-VN';
      if (currentLanguage === 'zh') langCode = 'zh-CN';
      if (currentLanguage === 'id') langCode = 'id-ID';
      if (currentLanguage === 'my') langCode = 'my-MM';
      if (currentLanguage === 'ko') langCode = 'ko-KR';
      if (currentLanguage === 'ja') langCode = 'ja-JP';
      
      utterance.lang = langCode;
      
      // 適切な音声（Voice）を探す
      const targetVoice = voices.find(voice => voice.lang.startsWith(langCode));
      if (targetVoice) {
        utterance.voice = targetVoice;
      }
      
      synth.speak(utterance);
    }

  <!-- PWA Service Worker 登録 (外部 sw.js から登録する標準方式) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          })
          .catch(error => {
            console.log('ServiceWorker registration failed: ', error);
          });
      });
    }
  </script>
